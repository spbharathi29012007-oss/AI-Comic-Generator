<!DOCTYPE html>
<html>
<head>
    <title>AI Comic Generator</title>
</head>

<body>

<h1>AI Comic Generator</h1>

<form action="/generate" method="post">

    <label>Story Prompt</label><br>
    <textarea name="story_prompt"></textarea>
    <br><br>

    <label>Main Character Name</label><br>
    <input type="text" name="character_name">
    <br><br>

    <label>Setting</label><br>
    <input type="text" name="setting">
    <br><br>

    <label>Story Tone</label><br>
    <input type="text" name="tone">
    <br><br>

    <label>Art Style</label><br>
    <input type="text" name="art_style">
    <br><br>

    <button type="submit">Generate Comic</button>

</form>

</body>
</html>
