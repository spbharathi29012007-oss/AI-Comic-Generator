<!DOCTYPE html>
<html>
<head>
    <title>Export Success</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🎉 Comic Exported Successfully!</h1>

        <p>Your comic has been exported successfully.</p>

        <p>You can create another comic whenever you want.</p>

        <a href="/">Create New Comic</a>

    </div>

</body>
</html>
